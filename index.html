<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flutter Wizard</title>
<style>
:root { color-scheme: light dark; --ink:#1b1b21; --soft:#5b5b68; --bg:#fffaf3;
        --card:#fff; --line:#e7ddcd; --accent:#2f6bff; }
@media (prefers-color-scheme: dark) {
  :root { --ink:#f3efe9; --soft:#a6abc4; --bg:#12131c; --card:#1b1d2b;
          --line:#2f3348; --accent:#37c2ff; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
header { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
header img { width:44px; height:44px; border-radius:10px; }
header b { font-size:15px; color:var(--soft); font-weight:600; }
h1 { font-size:30px; line-height:1.2; margin:18px 0 6px; letter-spacing:-.5px; }
.eff { color:var(--soft); font-size:14px; margin:0 0 24px; }
.summary { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:16px 18px; margin:0 0 32px; color:var(--soft); }
h2 { font-size:20px; margin:34px 0 8px; letter-spacing:-.3px; }
p { margin:0 0 12px; }
ul { margin:0 0 12px; padding-left:22px; }
li { margin:6px 0; }
a { color:var(--accent); }
footer { margin-top:52px; padding-top:20px; border-top:1px solid var(--line);
         color:var(--soft); font-size:14px; }
nav { margin-bottom:28px; font-size:14px; }
nav a { margin-right:16px; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icon.png" alt=""><b>Flutter Wizard</b></header>
  <h1>Learn Flutter through motion</h1>
  <div class="summary">A free, offline-first app that teaches Flutter — from
  "what is a variable" to "why this screen drops frames at scale".</div>
  <h2>Legal</h2>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Use</a></li>
  </ul>
  <h2>Support</h2>
  <p>Email <a href="mailto:hello@flutterwizard.app">hello@flutterwizard.app</a>.</p>
  <footer>Built 2026-09-11.</footer>
</div>
</body>
</html>
